# =============================================================================
# CONFIGURACIÓN DE NGINX — el archivo que hace que la app funcione de verdad
# =============================================================================
# Nginx cumple DOS papeles acá:
#   1. Servir los archivos estáticos de la SPA compilada.
#   2. Reenviar (proxy) todo lo que empiece con /api hacia el backend.
#
# El punto 2 es el que resuelve el "caso trampa de la SPA": el JavaScript corre
# en el navegador, que está FUERA de la red de compose y no puede resolver el
# nombre "backend". Nginx sí puede, porque él SÍ corre dentro de un contenedor.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # El DNS interno de Docker. Se declara explícitamente porque abajo usamos
    # una variable en proxy_pass.
    #
    # ⚠️ Un solo resolver, y el de Docker. Si se agrega un DNS público "por las
    # dudas" (8.8.8.8), nginx reparte las consultas entre los dos y el público
    # no sabe qué es "backend": aparecen 502 intermitentes con todo sano.
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8080;

    # -------------------------------------------------------------------------
    # Proxy de la API.
    #
    # ⚠️ El nombre va en una VARIABLE ($backend_api) y no escrito directo. Con
    # el nombre literal, nginx lo resuelve AL ARRANCAR y, si el backend todavía
    # no existe, se niega a levantar: "host not found in upstream". Con
    # variable, resuelve recién cuando llega un pedido.
    #
    # ⚠️ proxy_pass SIN barra al final: así /api/games llega al backend como
    # /api/games. Con barra, nginx reescribiría el prefijo y la API devolvería
    # 404 en todas las llamadas.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------------------
    # SPA fallback: cualquier ruta que no sea un archivo real devuelve
    # index.html, y React Router decide qué mostrar.
    #
    # Sin esto, recargar el navegador estando en /games/3 daría 404: nginx
    # buscaría un archivo llamado "games/3" que no existe.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
