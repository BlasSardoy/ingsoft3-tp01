name: CI

on:
  pull_request:
    branches: [main] # ← el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]  # ← sólo para que main tenga su corrida

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true # sin esto, "docker run" de abajo no encuentra la imagen
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/blassardoy/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/blassardoy/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; solo main despliega
    environment: qa
    steps:
      # imgURL le dice al hook QUÉ IMAGEN ejecutar: la sha-<commit> que publicó
      # este mismo pipeline. Render no construye nada, sólo la baja y la corre.
      # Render sólo acepta cambiar el tag/digest, no el nombre de la imagen
      # (si no, responde 400): por eso va escrito a mano, en minúsculas.
      # --get + --data-urlencode agregan imgURL a la query que ya trae el hook.
      - name: Desplegar en QA la IMAGEN del commit (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          IMG_API="ghcr.io/blassardoy/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/blassardoy/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://gamerate-api-qa.onrender.com
          URL_FRONT: https://gamerate-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/games" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/games" > /dev/null; then
              echo "✅ QA responde (API + BD + front + proxy del front a su api)"; exit 0
            fi
            echo "Intento $i: todavía no, espero 20 s"
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                       # QA ya ejecuta la imagen de ESTA corrida
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install (sin browser)
        run: npm ci                        # sin playwright install: estas pruebas no abren navegador
        working-directory: ./frontend
      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://gamerate-api-qa.onrender.com   # la API, no el front
          E2E_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend
      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion   # distinto del de e2e
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion                     # si la api está rota, no gastamos un browser
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend
      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://gamerate-front-qa.onrender.com   # el FRONT de QA
          E2E_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
        run: npx playwright test e2e/juegos.spec.js   # SU archivo
        working-directory: ./frontend
      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}            # el reporte importa más cuando falla
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                                  # EL gate: sin e2e verde ni siquiera se pide aprobación
    environment: production                     # ⏸ el workflow se pausa hasta la aprobación
    concurrency:
      group: deploy-prod
      cancel-in-progress: false                 # dos deploys a PROD no se pisan
    steps:
      # Manda la MISMA imagen que verificó QA (mismo github.sha, misma imagen
      # sha-<commit>): lo que se aprueba es exactamente lo que sube a PROD.
      # Igual que en QA, Render sólo acepta cambiar el tag/digest, no el nombre.
      # No repite el if de la rama: depende de deploy-qa, que sí lo tiene.
      - name: Desplegar en PROD la MISMA imagen (api + front)
        shell: bash
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          IMG_API="ghcr.io/blassardoy/ingsoft3-tp01-backend:sha-${{ github.sha }}"
          IMG_FRONT="ghcr.io/blassardoy/ingsoft3-tp01-frontend:sha-${{ github.sha }}"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_API" "$HOOK_API"
          curl -fsS --max-time 30 --get --data-urlencode "imgURL=$IMG_FRONT" "$HOOK_FRONT"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://gamerate-api-prod.onrender.com
          URL_FRONT: https://gamerate-front-prod.onrender.com
        run: |
          echo "Esperando a que PROD esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/games" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/games" > /dev/null; then
              echo "✅ PROD responde (API + BD + front + proxy del front a su api)"; exit 0
            fi
            echo "Intento $i: todavía no, espero 20 s"
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
