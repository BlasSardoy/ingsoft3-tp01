version: 2
updates:
  - package-ecosystem: "npm"            # backend (Node/Express)
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"            # frontend (React/Vite)
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions" # las actions del ci.yml también son dependencias
    directory: "/"
    schedule:
      interval: "weekly"
